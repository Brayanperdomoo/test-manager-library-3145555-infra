services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-manager_library}
      POSTGRES_USER: ${DB_USERNAME:-manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../test-manager-library-3145555-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: Manager Library
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in infra/.env}
      APP_URL: ${APP_URL:-http://localhost:8081}
      APP_TIMEZONE: UTC
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-manager_library}
      DB_USERNAME: ${DB_USERNAME:-manager}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      DB_SCHEMA: public,library
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in infra/.env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$r=@file_get_contents(\"http://127.0.0.1/api/v1/health\"); exit($$r === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../test-manager-library-3145555-app
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
